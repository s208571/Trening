:root{
  /* Forma: graphite gym floor + chalk text; competition-plate colors (25 red, 20 blue, 15 yellow, 10 green, 5 white) as accents.
     Layout idea: one thumb-width column, scoreboard numerals in a condensed face, cards as equipment plates. */
  --f-disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --e:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --rc:20px;--rb:14px;

  --bg:#eceef1;--s1:#ffffff;--s2:#f1f2f5;--s3:#e1e4e9;--ln:rgba(16,19,26,.09);
  --tx:#111318;--mu:#5d6470;--fa:#9aa1ad;--sh:0 1px 2px rgba(16,19,26,.05),0 8px 24px rgba(16,19,26,.06);
  --p-red:#d7372f;--p-blue:#1c5fdf;--p-yellow:#f2b50f;--p-green:#138f4b;--p-white:#23262c;
  --on-red:#fff;--on-blue:#fff;--on-yellow:#1d1600;--on-green:#fff;--on-white:#fff;
  --i-red:#c4302a;--i-blue:#1c5fdf;--i-yellow:#8f6500;--i-green:#117a41;--i-white:#23262c;
  --ok:#128a48;--wa:#a86a00;--bad:#cf3a33;
  --knurl:rgba(16,19,26,.055);--scrim:rgba(10,12,16,.38);--tbar:rgba(236,238,241,.84);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not(.t-light){
  --bg:#0c0d0f;--s1:#16181b;--s2:#1f2226;--s3:#2b2f35;--ln:rgba(255,255,255,.075);
  --tx:#f3f1ec;--mu:#8e949d;--fa:#5b616a;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
  --p-red:#ff5b52;--p-blue:#5a92ff;--p-yellow:#f6c43c;--p-green:#3fd083;--p-white:#ecebe6;
  --on-red:#260302;--on-blue:#04112b;--on-yellow:#231a00;--on-green:#03200f;--on-white:#111214;
  --i-red:#ff6f67;--i-blue:#7aa7ff;--i-yellow:#f6c43c;--i-green:#57d993;--i-white:#ecebe6;
  --ok:#45d088;--wa:#f2b44d;--bad:#ff6d64;
  --knurl:rgba(255,255,255,.045);--scrim:rgba(0,0,0,.55);--tbar:rgba(12,13,15,.82);
  color-scheme:dark;}}
:root[data-theme="dark"]:not(.t-light),:root.t-dark{
  --bg:#0c0d0f;--s1:#16181b;--s2:#1f2226;--s3:#2b2f35;--ln:rgba(255,255,255,.075);
  --tx:#f3f1ec;--mu:#8e949d;--fa:#5b616a;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
  --p-red:#ff5b52;--p-blue:#5a92ff;--p-yellow:#f6c43c;--p-green:#3fd083;--p-white:#ecebe6;
  --on-red:#260302;--on-blue:#04112b;--on-yellow:#231a00;--on-green:#03200f;--on-white:#111214;
  --i-red:#ff6f67;--i-blue:#7aa7ff;--i-yellow:#f6c43c;--i-green:#57d993;--i-white:#ecebe6;
  --ok:#45d088;--wa:#f2b44d;--bad:#ff6d64;
  --knurl:rgba(255,255,255,.045);--scrim:rgba(0,0,0,.55);--tbar:rgba(12,13,15,.82);
  color-scheme:dark;}
:root{--ac:var(--p-blue);--on-ac:var(--on-blue);--ac-i:var(--i-blue)}
:root.ac-red{--ac:var(--p-red);--on-ac:var(--on-red);--ac-i:var(--i-red)}
:root.ac-yellow{--ac:var(--p-yellow);--on-ac:var(--on-yellow);--ac-i:var(--i-yellow)}
:root.ac-green{--ac:var(--p-green);--on-ac:var(--on-green);--ac-i:var(--i-green)}
:root.ac-white{--ac:var(--p-white);--on-ac:var(--on-white);--ac-i:var(--i-white)}
:root{--ac-s:color-mix(in srgb,var(--ac) 15%,transparent);--ac-s2:color-mix(in srgb,var(--ac) 26%,transparent)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--tx);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4,p{margin:0}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:18px;height:18px}svg.i.xs{width:15px;height:15px;stroke-width:2.2}

main{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 132px)}
.vin-f{animation:vinF .5s var(--e) both}.vin-b{animation:vinB .5s var(--e) both}
@keyframes vinF{from{opacity:0;transform:translateX(26px)}}@keyframes vinB{from{opacity:0;transform:translateX(-26px)}}
.fade-up{animation:fup .55s var(--e) both}@keyframes fup{from{opacity:0;transform:translateY(12px)}}

/* type */
.eb{font:600 12.5px/1.1 var(--f-disp);letter-spacing:.13em;text-transform:uppercase;color:var(--mu)}
.d1{font:800 46px/.9 var(--f-disp);letter-spacing:-.005em;text-transform:uppercase;text-wrap:balance}
.d2{font:800 32px/.95 var(--f-disp);text-transform:uppercase;text-wrap:balance}
.d3{font:800 22px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.num{font-family:var(--f-disp);font-weight:800}
.tab{font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.sm{font-size:13.5px}.fa{color:var(--fa)}
small{font-size:13.5px;color:var(--mu)}
.note{font-size:13.5px;color:var(--mu);margin:10px 2px 0;line-height:1.45}
.sec{display:flex;align-items:center;gap:10px;margin:30px 2px 12px;font:800 15px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.sec>i{flex:1;height:1px;background:var(--ln)}
.sec .link{font-size:15px;letter-spacing:.06em}
.link{font:700 15px/1 var(--f-disp);letter-spacing:.07em;text-transform:uppercase;color:var(--ac-i);padding:8px 2px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.top .eb{margin-bottom:8px}
.streak{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 10px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font:800 22px/1 var(--f-disp);white-space:nowrap}
.streak svg{color:var(--p-red);width:20px;height:20px}.streak small{font:600 11px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;margin-left:2px}
.streak.z svg{color:var(--fa)}
.backbar{display:flex;align-items:center;gap:6px;margin:-6px 0 14px;padding:10px 14px;border-radius:12px;background:var(--ac-s);color:var(--ac-i);font:700 15px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;width:100%}

/* cards & buttons */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--rc);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:var(--rb);background:var(--ac);color:var(--on-ac);font:800 18px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;transition:transform .25s var(--e),filter .2s,background .3s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97);filter:brightness(.93)}
.btn.g{background:var(--s2);color:var(--tx)}.btn.g:active{filter:brightness(.96)}
.btn.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--s3);color:var(--tx)}
.btn.dg{background:var(--s2);color:var(--bad)}.btn.dgf{background:var(--bad);color:#fff}
.btn.sm{min-height:42px;font-size:16px;padding:0 14px}
.btn svg.i{width:20px;height:20px;stroke-width:2.2}
.btns{display:flex;gap:8px;margin-top:12px}.btns>*{flex:1}
.stack>*+*{margin-top:8px}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);color:var(--tx);flex:none;transition:transform .25s var(--e),background .3s}
.ibtn:active{transform:scale(.9)}.ibtn.clr{background:transparent}.ibtn.sm{width:34px;height:34px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 11px;border-radius:10px;background:var(--s2);color:var(--tx);font:700 14px/1 var(--f-disp);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;transition:background .25s,color .25s,transform .25s var(--e)}

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));

 return h}

 return `<article class="card wc${done?' done':''}" style="--bc:var(--p-${b.c})"><div class="wc-top"><span class="eb"><i></i>${b.time} · ok. ${dur(b)} min</span><button class="ibtn sm clr" data-a="bk:${b.id}" aria-label="Szczegóły treningu">${ic('more')}</button></div>
 <h3>${esc(b.name)}</h3>${done&&ses?sumMini(ses):`<p class="meta">${b.ex.length} ${plural(b.ex.length,'ćwiczenie','ćwiczenia','ćwiczeń')} · ${ns} ${plural(ns,'seria','serie','serii')} · ${esc(b.ex.slice(0,3).map(e=>e.n).join(', '))}${b.ex.length>3?'…':''}</p>`}

 // pts: [{d,v,t?}] sorted; o: {goal, unit, dec, trend:true}

 const goalIn=o.goal!=null&&o.goal>=lo&&o.goal<=hi;if(goalIn){const y=Y(o.goal);s+=`<line class="goal-l" x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${W-pr}" y="${(y-6).toFixed(1)}" text-anchor="end">Cel ${fn(o.goal,1)}</text>`}
 s+=`<path class="${anim?'ar':''}" fill="var(--c)" fill-opacity=".1" d="${tl}L${X(pts[pts.length-1].d).toFixed(1)} ${Hh-pb}L${X(pts[0].d).toFixed(1)} ${Hh-pb}Z"/>`;
 s+=`<path class="ln${anim?' draw':''}" stroke="var(--c)" pathLength="1" d="${tl}"/>`;
 if(hasT||o.dots)pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?5:3.5}" fill="${hasT&&!last?'var(--s1)':'var(--c)'}" stroke="${hasT&&!last?'var(--c)':'var(--s1)'}" stroke-width="2"/>`});
 const lp=pts[pts.length-1];s+=`<text x="${Math.min(W-pr,X(lp.d)).toFixed(1)}" y="${(Y(lp.v)-11).toFixed(1)}" text-anchor="end" style="fill:var(--tx);font-weight:800;font-size:13px">${fn(lp.v,dec)}</text>`;
 s+=`<line class="xh" x1="0" x2="0" y1="${pt}" y2="${Hh-pb}"/><circle class="xh" r="6" fill="var(--c)" stroke="var(--s1)" stroke-width="2.5" cx="0" cy="0" style="stroke:var(--s1)"/></svg><div class="tip"><b></b><small></small></div>`;
 el.innerHTML=s;
 const svg=$('svg',el),xh=$$('.xh',el),tip=$('.tip',el);
 const show=cx=>{const r=svg.getBoundingClientRect(),x=(cx-r.left)*(W/r.width);let bi=0,bd=1e9;pts.forEach((p,i)=>{const dd=Math.abs(X(p.d)-x);if(dd<bd){bd=dd;bi=i}});const p=pts[bi],px=X(p.d),py=Y(p.v);

 return C.st==='ok'?'Na Twoim koncie, zapisano '+hm:C.st==='sync'?'Zapisuję na koncie…':C.st==='err'?'Błąd zapisu na koncie ('+esc(C.err)+'). Dane są w tym urządzeniu.':'Tylko w tym urządzeniu'}
function updSync(){const t=$('#syncTx'),d=$('#syncDot');if(t)t.innerHTML=syncTxt();if(d)d.className='sync '+C.st}
function hbList(){return S.habits.length?`<div class="sl" data-sort="hb">${S.habits.map((h,i)=>`<div class="sli" data-si="${i}"><span class="drag" aria-hidden="true">${ic('drag')}</span><button class="sb" data-a="hbEdit:${esc(h.id)}" style="display:flex;align-items:center;gap:10px"><span class="hic" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--s1);color:var(--mu);flex:none">${ic(h.ic,'s')}</span><span style="min-width:0"><b>${esc(h.n)}</b><small>${h.t==='num'?`licznik · cel ${fmtU(h.goal,h)} ${esc(h.unit)} · krok ${fmtU(h.step,h)}`:'odhaczenie'}</small></span></button><button class="ibtn clr" data-a="hbDel:${esc(h.id)}" aria-label="Usuń: ${esc(h.n)}">${ic('x','s')}</button></div>`).join('')}</div>`:'<div class="empty">Brak nawyków.</div>'}
VIEWS.opts=function(){
 const s=S.set;
 return `<header class="top"><div><p class="eb">Cele, wygląd i dane</p><h1 class="d1">Opcje</h1></div></header>
 <h2 class="sec"><span>Cele</span><i></i></h2>
 <div class="card" style="padding:4px 16px">
  <div class="row"><div><b>Kalorie dziennie</b><small>przytrzymaj, aby zmieniać szybciej</small></div><div class="step"><button data-a="kcal:-50" data-rep aria-label="Mniej o 50 kcal">${ic('minus')}</button><b id="kv">${fn(s.kcal,0)}</b><button data-a="kcal:50" data-rep aria-label="Więcej o 50 kcal">${ic('plus')}</button></div></div>
  <div class="row"><div><b>Waga docelowa</b><small>${s.goalW?'pasek celu i prognoza w Postępach':'wpisz, aby widzieć drogę do celu'}</small></div><input class="in num" id="gw" inputmode="decimal" style="width:108px;text-align:center;font-size:22px" value="${s.goalW?fx(s.goalW):''}" placeholder="kg" data-ch="goalW" enterkeyhint="done" aria-label="Waga docelowa w kg"></div>
  <div class="row" style="display:block"><b>Tempo przyrostu</b><small>na tydzień; według niego oceniam trend wagi</small><div class="seg" style="margin-top:10px">${Object.keys(RATES).map(k=>`<button class="${s.rate===k?'on':''}" data-a="setRate:${k}" aria-pressed="${s.rate===k}" style="min-height:50px;line-height:1.15">${RATES[k][2]}<br><span style="font:600 11.5px var(--f-body);letter-spacing:0;text-transform:none">${RATES[k][3]}</span></button>`).join('')}</div></div>
  <div class="row" style="display:block"><b>Dni ważenia</b><small>rano przypomnę o pomiarze</small><div class="d7c" style="margin-top:10px">${DS.map((n,i)=>`<button class="${s.weighDays.includes(i)?'on':''}" data-a="wday:${i}" aria-pressed="${s.weighDays.includes(i)}">${n}</button>`).join('')}</div></div>
 </div>
 <h2 class="sec"><span>Lista dnia</span><i></i><button class="link" data-a="hbNew">Dodaj</button></h2>
 <div class="card" style="padding:12px">${hbList()}<p class="note">Przeciągnij ≡, aby zmienić kolejność. Dotknij nawyku, aby go edytować.</p></div>
 <div class="card" style="padding:4px 16px"><div class="row" style="display:block"><b>Dzień zaliczony od</b><small>liczy się do serii dni i kalendarza</small><div class="seg" style="margin-top:10px">${[60,80,100].map(p=>`<button class="${s.dayPct===p?'on':''}" data-a="dayPct:${p}" aria-pressed="${s.dayPct===p}">${p}%</button>`).join('')}</div></div></div>
 <h2 class="sec"><span>Trening</span><i></i></h2>
 <div class="card" style="padding:4px 16px">
  ${swRow('autoRest','Automatyczna przerwa','timer rusza po odhaczeniu serii')}
  ${swRow('sound','Dźwięk końca przerwy','krótki sygnał, gdy przerwa minie')}
  <div class="row" style="display:block"><b>Krok progresji</b><small>ile kg podpowiadam dołożyć po górze zakresu</small><div class="seg" style="margin-top:10px">${[1,1.25,2.5,5].map(v=>`<button class="${s.wStep===v?'on':''}" data-a="wStepSet:${v}" aria-pressed="${s.wStep===v}">${fn(v,2)} kg</button>`).join('')}</div></div>
  <button class="row tap" data-a="tplRestore" style="width:100%;text-align:left"><div><b>Przywróć szablon tygodnia</b><small>Góra A, Dół A, Góra B, Dół B</small></div>${ic('refresh','s chev')}</button>
 </div>
 <h2 class="sec"><span>Wygląd</span><i></i></h2>
 <div class="card" style="padding:4px 16px">
  <div class="row" style="display:block"><b>Motyw</b><div class="seg" style="margin-top:10px">${[['auto','Auto'],['dark','Ciemny'],['light','Jasny']].map(([k,l])=>`<button class="${s.theme===k?'on':''}" data-a="theme:${k}" aria-pressed="${s.theme===k}">${l}</button>`).join('')}</div></div>
  <div class="row" style="display:block"><b>Kolor akcentu</b><small>kolory talerzy olimpijskich</small><div class="swatches" style="margin-top:12px;justify-content:space-between">${PL.map(c=>swatch(c,s.accent===c,'accent:'+c)).join('')}</div></div>
  ${swRow('haptics','Wibracje','na iPhonie działają od iOS 18')}
  ${swRow('motion','Animacje','przejścia, konfetti i efekty')}
 </div>
 <h2 class="sec"><span>Dane</span><i></i></h2>
 <div class="card" style="padding:4px 16px">
  <div class="row"><div><b>Zapis</b><small id="syncTx">${syncTxt()}</small></div><span class="sync ${C.st}" id="syncDot"><i></i></span></div>
  <button class="row tap" data-a="exportCopy" style="width:100%;text-align:left"><div><b>Kopiuj kopię zapasową</b><small>cały stan jako tekst JSON do schowka</small></div>${ic('copy','s chev')}</button>
  ${dlOK?`<button class="row tap" data-a="exportDl" style="width:100%;text-align:left"><div><b>Pobierz kopię</b><small>plik .json na urządzenie</small></div>${ic('dl','s chev')}</button>`:''}
  <button class="row tap" data-a="importOpen" style="width:100%;text-align:left"><div><b>Wczytaj kopię</b><small>z pliku albo wklejonego tekstu</small></div>${ic('up','s chev')}</button>
  <button class="row tap" data-a="wClear" style="width:100%;text-align:left"><div><b>Wyczyść pomiary wagi</b><small>${S.w.length} ${plural(S.w.length,'pomiar','pomiary','pomiarów')}</small></div>${ic('trash','s chev')}</button>
  <button class="row tap" data-a="logClear" style="width:100%;text-align:left"><div><b>Wyczyść historię treningów</b><small>${sessions().length} w historii</small></div>${ic('trash','s chev')}</button>
  <button class="row tap" data-a="resetAll" style="width:100%;text-align:left"><div><b style="color:var(--bad)">Zacznij od zera</b><small>plan, nawyki, pomiary i historia</small></div>${ic('trash','s chev')}</button>
 </div>
 <p class="foot">Forma 2.0 · trening i masa</p>`};
H.kcal=([d])=>{S.set.kcal=clamp(S.set.kcal+(+d),1200,6000);const kh=HB('kcal');if(kh&&kh.t==='num')kh.goal=S.set.kcal;save();buzz();const v=$('#kv');if(v)v.textContent=fn(S.set.kcal,0)};
CH.goalW=t=>{const v=nOrNull(t.value);S.set.goalW=v&&v>30&&v<300?Math.round(v*10)/10:null;save();t.value=S.set.goalW?fx(S.set.goalW):'';toast(S.set.goalW?'Waga docelowa: '+fx(S.set.goalW)+' kg':'Usunięto wagę docelową')};
H.setRate=([k])=>{if(!RATES[k])return;S.set.rate=k;save();buzz();renderMain()};
H.wday=([i])=>{i=+i;const a=S.set.weighDays;S.set.weighDays=a.includes(i)?a.filter(x=>x!==i):a.concat(i).sort();save();buzz();renderMain()};
H.dayPct=([p])=>{S.set.dayPct=+p;save();buzz();renderMain()};
H.tog=([k])=>{S.set[k]=!S.set[k];save();if(k==='motion')applyTheme();if(k==='sound'&&S.set.sound){audioUnlock();setTimeout(()=>beep(),60)}if(k==='haptics'&&S.set.haptics)buzz('heavy');renderMain()};
H.wStepSet=([v])=>{S.set.wStep=+v;save();buzz();renderMain()};
H.theme=([t])=>{S.set.theme=t;save();applyTheme();buzz();renderMain()};
H.accent=([c])=>{if(!PL.includes(c))return;S.set.accent=c;save();applyTheme();buzz('heavy');renderMain()};
H.tplRestore=async()=>{const ok=await ask({title:'Przywrócić szablon?',text:'Plan wróci do: Góra A (pon), Dół A (wt), Góra B (czw), Dół B (pt). Twoje zmiany w planie znikną, historia zostaje.',ok:'Przywróć',danger:true});if(!ok)return;undoable('Przywrócono szablon tygodnia',()=>{S.blocks=seedBlocks()})};
H.wClear=async()=>{if(!S.w.length)return toast('Brak pomiarów');const ok=await ask({title:'Wyczyścić pomiary?',text:`Usuniesz ${S.w.length} ${plural(S.w.length,'pomiar','pomiary','pomiarów')} wagi.`,ok:'Wyczyść',danger:true});if(!ok)return;undoable('Wyczyszczono pomiary',()=>{S.w=[]})};
H.logClear=async()=>{const n=sessions().length;if(!n)return toast('Historia treningów jest pusta');const ok=await ask({title:'Wyczyścić historię?',text:`Usuniesz ${n} ${plural(n,'trening','treningi','treningów')} z historii siły.`,ok:'Wyczyść',danger:true});if(!ok)return;undoable('Wyczyszczono historię',()=>{for(const k in LOGS)LOGS[k].items=[];logVer++},{logs:1})};
H.resetAll=async()=>{const ok=await ask({title:'Zacząć od zera?',text:'Plan, nawyki, odhaczenia, pomiary i historia treningów wrócą do stanu początkowego.',ok:'Wyczyść wszystko',danger:true});if(!ok)return;
 undoable('Wyczyszczono wszystko',()=>{const keep={theme:S.set.theme,accent:S.set.accent};S=seedS();Object.assign(S.set,keep);for(const k in LOGS)LOGS[k].items=[];logVer++;viewD=null},{logs:1})};
const dump=()=>JSON.stringify({app:'forma',v:2,at:new Date().toISOString(),S,L:LOGS});
H.exportCopy=()=>{let p;try{p=navigator.clipboard.writeText(dump())}catch(e){p=Promise.reject(e)}p.then(()=>toast('Skopiowano kopię do schowka')).catch(()=>shOpen(pExport,{}))};
function pExport(){return shHead('Kopia zapasowa')+`<p class="mu sm">Schowek jest tu niedostępny. Zaznacz tekst i skopiuj go ręcznie.</p><textarea class="in" readonly style="min-height:240px;margin-top:12px" onfocus="this.select()">${esc(dump())}</textarea>`}
H.exportDl=async()=>{const dl=await DL();if(!dl)return toast('Pobieranie jest tu niedostępne');try{await dl.save({filename:'forma-kopia-'+today()+'.json',data:dump()});toast('Zapisano kopię')}catch(e){if(e&&e.code==='declined')return;toast('Nie udało się zapisać pliku')}};
H.importOpen=()=>shOpen(pImport,{});
function pImport(){return shHead('Wczytaj kopię')+`<p class="mu sm">Obecne dane zostaną zastąpione. Zaraz po wczytaniu możesz to cofnąć.</p>
 <label class="lb" for="imf">Plik z kopią</label><input id="imf" class="in" type="file" accept=".json,application/json,text/plain" data-ch="impFile">
 <label class="lb" for="imt">Albo wklej tekst</label><textarea id="imt" class="in" placeholder="{&quot;app&quot;:&quot;forma&quot;, …}" spellcheck="false"></textarea>
 <div class="btns"><button class="btn" data-a="importDo">${ic('up')} Wczytaj</button></div>`}
CH.impFile=async t=>{const f=t.files&&t.files[0];if(!f)return;try{$('#imt').value=await f.text();toast('Plik wczytany. Zatwierdź przyciskiem.')}catch(e){toast('Nie udało się odczytać pliku')}};
H.importDo=async()=>{let o;try{o=JSON.parse($('#imt').value)}catch(e){toast('To nie jest poprawny JSON');return}
 let ns,nl;if(o&&o.S&&Array.isArray(o.S.blocks)){ns=norm(o.S);nl=normLogs(o.L)}else if(o&&Array.isArray(o.blocks)){ns=fromV1(o);nl={}}else{toast('Nie rozpoznaję tej kopii');return}
 const nh=Object.values(nl).reduce((a,x)=>a+x.items.length,0);
 const ok=await ask({title:'Zastąpić dane?',text:`Kopia zawiera ${ns.blocks.length} ${plural(ns.blocks.length,'trening','treningi','treningów')} w planie, ${ns.w.length} ${plural(ns.w.length,'pomiar','pomiary','pomiarów')} i ${nh} w historii.`,ok:'Zastąp',danger:true});if(!ok)return;
 shClose(true);undoable('Wczytano kopię',()=>{const L2={};new Set([...Object.keys(LOGS),...Object.keys(nl)]).forEach(k=>{L2[k]=nl[k]||{t:0,items:[]}});S=ns;LOGS=L2;logVer++;viewD=null},{logs:1});applyTheme()};

/* ----- habits manager & editor ----- */
H.habits=()=>shOpen(pHabitsMgr,{});
function pHabitsMgr(){return shHead('Lista dnia')+`<p class="mu sm" style="margin-bottom:12px">Przeciągnij ≡, aby zmienić kolejność. Dotknij nawyku, aby go edytować. Liczniki (np. woda) mają przyciski plus i minus.</p>${hbList()}
 <div class="btns"><button class="btn g" data-a="hbNew">${ic('plus')} Dodaj nawyk</button></div><div class="btns"><button class="btn" data-a="shClose">Gotowe</button></div>`}
SORT.hb=(p,from,to)=>{const x=S.habits.splice(from,1)[0];S.habits.splice(to,0,x);save();if(SH.open)shRefresh();else renderMain()};
let hbDraft=null;
H.hbNew=()=>{hbDraft=null;if(SH.open)shPush(pHbEdit,{id:'new'});else shOpen(pHbEdit,{id:'new'})};
H.hbEdit=([id])=>{if(!HB(id))return;hbDraft=null;if(SH.open)shPush(pHbEdit,{id});else shOpen(pHbEdit,{id})};
function pHbEdit({id}){
 const ex=id!=='new'?HB(id):null;if(id!=='new'&&!ex)return shHead('')+'<div class="empty">Nawyk usunięty.</div>';
 if(!hbDraft||hbDraft._for!==id)hbDraft=ex?{...ex,goal:ex.goal||1,step:ex.step||1,unit:ex.unit||'',_for:id}:{id:'h'+uid(),n:'',ic:'check',t:'check',goal:8,step:1,unit:'szkl.',_for:id};
 const h=hbDraft;
 return shHead(ex?'Edytuj nawyk':'Nowy nawyk')+`<label class="lb" for="hn">Nazwa</label><input id="hn" class="in" data-in="hdN" value="${esc(h.n)}" placeholder="np. Rozciąganie 10 min" maxlength="60" autocomplete="off" enterkeyhint="done">
 <label class="lb">Rodzaj</label><div class="seg"><button class="${h.t==='check'?'on':''}" data-a="hdT:check" aria-pressed="${h.t==='check'}">Odhaczenie</button><button class="${h.t==='num'?'on':''}" data-a="hdT:num" aria-pressed="${h.t==='num'}">Licznik</button></div>
 ${h.t==='num'?`<div class="r2" style="grid-template-columns:1fr 1fr 1fr"><div><label class="lb" for="hg">Cel</label><input id="hg" class="in" inputmode="decimal" data-in="hdG" value="${fn(h.goal,2)}" autocomplete="off"></div><div><label class="lb" for="hs">Krok +</label><input id="hs" class="in" inputmode="decimal" data-in="hdS" value="${fn(h.step,2)}" autocomplete="off"></div><div><label class="lb" for="hu">Jednostka</label><input id="hu" class="in" data-in="hdU" value="${esc(h.unit)}" maxlength="12" autocomplete="off"></div></div><p class="note">Plus dodaje jeden krok. Nawyk jest zrobiony po dojściu do celu.${h.id==='kcal'?' Cel kalorii jest powiązany z celem w Opcjach.':''}</p>`:''}
 <label class="lb">Ikona</label><div class="chips">${HB_ICONS.map(k=>`<button class="ibtn${h.ic===k?' on-ic':''}" data-a="hdI:${k}" aria-label="Ikona ${k}" aria-pressed="${h.ic===k}">${ic(k)}</button>`).join('')}</div>
 <div class="btns"><button class="btn" data-a="hdSave">${ic('check')} Zapisz</button></div>
 ${ex?`<div class="acts" style="margin-top:12px"><button class="act dg" data-a="hbDel:${esc(ex.id)}">${ic('trash')}Usuń nawyk</button></div>`:''}`}
IN.hdN=t=>{if(hbDraft)hbDraft.n=t.value.slice(0,60)};
IN.hdG=t=>{if(hbDraft){const v=pnum(t.value);if(v>0)hbDraft.goal=v}};
IN.hdS=t=>{if(hbDraft){const v=pnum(t.value);if(v>0)hbDraft.step=v}};
IN.hdU=t=>{if(hbDraft)hbDraft.unit=t.value.slice(0,12)};
H.hdT=([t])=>{if(!hbDraft)return;hbDraft.t=t;if(t==='num'&&hbDraft.id==='kcal'){hbDraft.goal=S.set.kcal;hbDraft.step=hbDraft.step>1?hbDraft.step:250;hbDraft.unit='kcal'}buzz();shRefresh()};
H.hdI=([k])=>{if(!hbDraft)return;hbDraft.ic=k;buzz();$$('[data-a^="hdI:"]').forEach(b=>{const on=b.dataset.a==='hdI:'+k;b.classList.toggle('on-ic',on);b.setAttribute('aria-pressed',on)})};
H.hdSave=()=>{const h=hbDraft;if(!h)return;const n=($('#hn')?$('#hn').value:h.n).trim();if(!n){toast('Wpisz nazwę nawyku');const i=$('#hn');i&&i.focus();return}
 const x={id:h.id,n:n.slice(0,60),ic:h.ic,t:h.t};if(h.t==='num'){x.goal=Math.max(.01,+h.goal||1);x.step=Math.max(.01,+h.step||1);x.unit=String(h.unit||'').trim()}
 if(x.id==='kcal'&&x.t==='num')S.set.kcal=clamp(Math.round(x.goal),1200,6000);
 const i=S.habits.findIndex(q=>q.id===h._for);if(i>=0)S.habits[i]=x;else S.habits.push(x);
 hbDraft=null;save();buzz('heavy');if(SH.stack.length>1)shPop();else shClose(true);renderMain();toast(i>=0?'Zapisano nawyk':'Dodano: '+x.n)};
H.hbDel=([id])=>{const h=HB(id);if(!h)return;if(shTop()&&shTop().fn===pHbEdit){if(SH.stack.length>1)shPop();else shClose(true)}
 undoable('Usunięto: '+h.n,()=>{S.habits=S.habits.filter(x=>x.id!==id)});if(SH.open)shRefresh()};

/* ================= boot ================= */
function boot(hot){
 hot=hot||{};loadUI();localOrigin=loadLocal();
 if(hot.tab&&TABS.includes(hot.tab))tab=hot.tab;if(hot.pseg)pseg=hot.pseg;if(typeof hot.planDay==='number')planDay=hot.planDay;if(hot.viewD&&hot.viewD<today())viewD=hot.viewD;
 applyTheme();renderNav();renderMain(true,'f');updMini();if(S.rest)restTick();
 if(S.act&&hot.wo)woOpen();
 setInterval(()=>{if(tab==='today'&&!SH.open&&!WO.open&&document.visibilityState==='visible'){const r=$('#rem');if(r)r.innerHTML=remHtml()}},30000);
 let lastDay=today();setInterval(()=>{const t=today();if(t!==lastDay){lastDay=t;if(viewD&&viewD>=t)viewD=null;if(!SH.open&&!WO.open)renderMain()}},60000);
 RM.addEventListener&&RM.addEventListener('change',()=>applyTheme());
 try{const h=window.claude&&window.claude.hot;if(h&&typeof h.snapshot==='function')h.snapshot(()=>({tab,pseg,planDay,viewD,wo:WO.open}))}catch(e){}
 setTimeout(()=>{cloudInit();DL().then(d=>{if(d){dlOK=true;if(tab==='opts'&&!SH.open)renderMain()}})},0)}
(function(){let h=null;try{h=window.claude&&window.claude.hot}catch(e){}
 try{if(h&&typeof h.ready==='function')h.ready(boot);else boot((h&&h.data)||{})}catch(e){console.error(e);if(!S)boot({})}})();

</script>
