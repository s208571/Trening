function vWeight(){const w=S.w.slice().sort((a,b)=>a.d<b.d?-1:1),l=w[w.length-1],dl=wk();let cl='',adv='';if(dl!=null){if(dl>=.25&&dl<=.6){cl='ok';adv='Tempo w sam raz dla czystej masy.'}else if(dl>.6){cl='wa';adv='Za szybko, część przyrostu to tłuszcz. Zmniejsz nadwyżkę o około 200 kcal.'}else{cl='wa';adv='Za wolno. Dołóż około 250 kcal dziennie, np. szejk albo banany z masłem orzechowym.'}}
return `<h1>Waga i skład</h1><p class="sub">Mierz się rano, na czczo, 3 razy w tygodniu.</p><div class="card"><div class="big2">${l?fm(l.w)+' kg':'Brak pomiarów'}</div>${l&&det(l)?`<small>${det(l)}</small>`:''}<div style="margin-top:8px">${dl!=null?`<div class="chip2 ${cl}">${dl>0?'+':''}${fm(dl)} kg w tygodniu</div><small>${adv}</small>`:'<small>Dodaj pomiary z kilku dni, a policzę zmianę tygodniową.</small>'}</div>
<div class="seg">${[['w','Waga'],['f','Tłuszcz'],['m','Mięśnie']].map(x=>`<button data-a="ser:${x[0]}" class="${ser===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>${chart()}</div><button class="btn" data-a="wsh">Dodaj pomiar</button>
<h3>Historia (przytrzymaj, aby usunąć)</h3>${w.length?w.slice().reverse().slice(0,14).map(e=>`<div class="hrow" data-lp="wdel:${e.d}"><div><b>${e.d.slice(8)}.${e.d.slice(5,7)}</b>${det(e)?`<small>${det(e)}</small>`:''}</div><b>${fm(e.w)} kg</b></div>`).join(''):'<div class="empty">Brak wpisów.</div>'}`}
function vOpts(){return `<h1>Opcje</h1><p class="sub">Cele, szablon i zapis danych.</p><div class="card"><div class="row"><span>Dzienny cel kalorii</span><div class="step"><button data-a="kc:-100">−</button><b id="kv">${S.set.kcal}</b><button data-a="kc:100">+</button></div></div><div class="row"><span>Zapis danych</span><small>${sync?'na koncie i w urządzeniu':'tylko w tym urządzeniu'}</small></div></div>
<h3>Szablon</h3><div class="card"><p class="sm" style="margin-top:0">Góra A, Dół A, Góra B i Dół B w pon, wt, czw, pt. Przerwy: ciężkie złożone 2–3 min, pozostałe złożone 2 min, izolacje 45–90 s.</p><button class="btn g" data-a="rs">Przywróć szablon tygodnia</button></div><h3>Dane</h3><div class="card"><button class="btn g" style="margin:0" data-a="cm">Wyczyść pomiary wagi</button></div>`}
const V={today:vToday,week:vWeek,weight:vWeight,opts:vOpts};
function render(a){const v=$('#v');v.className='';void v.offsetWidth;v.className=a?'in':'';v.innerHTML=V[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.a==='tab:'+tab));if(tab==='today')setTimeout(upRing,40)}
function sheet(h){const s=$('#sh');s.innerHTML='<div class="grab"></div>'+h;s.classList.add('on');$('#ov').classList.add('on');s.scrollTop=0}

function toast(m){const e=$('#ts');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function timer(s){te=Date.now()+s*1000;$('#tp').className='on';clearInterval(ti);ti=setInterval(tk,200);tk()}
function tk(){const p=$('#tp'),r=Math.ceil((te-Date.now())/1000);if(r<=0){p.textContent='Koniec przerwy, do roboty';p.className='on dn';clearInterval(ti);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{p.className=''},3500)}else p.textContent='Przerwa '+fr(r)}
function arm(t,fn){if(t.dataset.arm){fn();return}t.dataset.arm=1;const o=t.textContent;t.textContent='Dotknij ponownie, aby potwierdzić';setTimeout(()=>{delete t.dataset.arm;t.textContent=o},2600)}
function bSheet(id,ed){const b=B(id);if(!b)return;let h;
if(ed){h=`<h2>Edytuj blok</h2><label>Nazwa</label><input data-b="${b.id}" data-f="name" value="${esc(b.name)}"><div class="row2"><div><label>Dzień</label><select data-b="${b.id}" data-f="day">${DF.map((d,i)=>`<option value="${i}"${i===b.day?' selected':''}>${d}</option>`).join('')}</select></div><div><label>Godzina</label><input type="time" data-b="${b.id}" data-f="time" value="${b.time}"></div></div>`+b.ex.map((e,i)=>{const a=`data-b="${b.id}" data-i="${i}"`;return `<div class="edx"><input ${a} data-f="n" value="${esc(e.n)}"><div class="row2"><div><label>Serie</label><input ${a} data-f="s" type="number" inputmode="numeric" value="${e.s}"></div><div><label>Powtórzenia</label><input ${a} data-f="r" value="${esc(e.r)}"></div></div><div class="row2"><div><label>Przerwa (s)</label><input ${a} data-f="p" type="number" inputmode="numeric" value="${e.p}"></div><div><label>Superset</label><select ${a} data-f="g">${[0,1,2,3].map(g=>`<option value="${g}"${g===e.g?' selected':''}>${g?'nr '+g:'brak'}</option>`).join('')}</select></div></div><button class="chip red" data-a="rm:${b.id}:${i}">Usuń ćwiczenie</button></div>`}).join('')+`<button class="btn g" data-a="ax:${b.id}">Dodaj ćwiczenie</button><button class="btn g red" data-a="dl:${b.id}">Usuń blok</button><button class="btn" data-a="blk:${b.id}">Gotowe</button>`}
else h=`<h2>${esc(b.name)}</h2><p class="sub">${DF[b.day]}, ${b.time}, około ${dur(b)} min</p>`+b.ex.map((e,i)=>`<div class="ex${e.g?' ss':''}"><div><b>${esc(e.n)}</b><small>${e.s} × ${esc(e.r)}, przerwa ${fr(e.p)}${e.g?', superset '+e.g:''}</small></div><button class="chip a" data-a="tm:${e.p}">Start</button><button class="chip" data-a="sx:${b.id}:${i}">${e.o?'Oryginał':'Łatwiej'}</button></div>`).join('')+`<h3>Dostosuj trening</h3>${b.ex.some(e=>e.g)?`<button class="btn g" style="margin:0 0 8px" data-a="split:${b.id}">Rozbij supersety na osobne serie</button>`:''}<div class="row2"><button class="btn g" style="margin:0" data-a="adj:${b.id}:-10">Skróć o około 10 min</button><button class="btn g" style="margin:0" data-a="adj:${b.id}:8">Wydłuż o około 8 min</button></div><p class="sm">Łatwiej zamienia ćwiczenie na prostszy technicznie wariant, drugie dotknięcie wraca do oryginału. Start włącza odliczanie przerwy.</p><div class="row2"><button class="btn g" data-a="edit:${b.id}">Edytuj</button><button class="btn" data-a="cl">Zamknij</button></div>`;
sheet(h)}
const wSheet=()=>sheet(`<h2>Nowy pomiar</h2><label>Data</label><input id="f-d" type="date" value="${ymd(new Date())}"><label>Waga (kg)</label><input id="f-w" inputmode="decimal" placeholder="np. 66,2"><div class="row2"><div><label>Tkanka tłuszczowa (%)</label><input id="f-b" inputmode="decimal" placeholder="opcjonalnie"></div><div><label>Mięśnie (%)</label><input id="f-m" inputmode="decimal" placeholder="opcjonalnie"></div></div><p class="sm">Z procentów policzę masę tłuszczu, mięśni i masę beztłuszczową w kg.</p><button class="btn" data-a="ws">Zapisz pomiar</button>`);
const H={tab:t=>{tab=t;render(1)},day:i=>{selD=+i;render()},
ck:(k,t)=>{const d=ymd(new Date()),c=S.ck[d]||(S.ck[d]={});c[k]=!c[k];t.classList.toggle('on',!!c[k]);save();upRing()},
bd:(id,t)=>{const d=ymd(new Date()),c=S.ck[d]||(S.ck[d]={}),k='b'+id;c[k]=!c[k];t.classList.toggle('on',!!c[k]);save();upRing()},
blk:id=>bSheet(id,0),edit:id=>bSheet(id,1),cl:()=>{closeSheet();render()},
add:()=>sheet(`<h2>Dodaj blok</h2><p class="sub">${DF[selD]}</p>`+Object.keys(T).map(k=>`<div class="opt" data-a="new:${k}"><b>${k}</b><small>z szablonu, około ${dur(mk(0,'',k))} min</small></div>`).join('')+'<div class="opt" data-a="new:"><b>Pusty blok</b><small>własne ćwiczenia</small></div>'),
new:n=>{const b=mk(selD,'17:00',n);if(!n)b.name='Nowy blok';S.blocks.push(b);save();render();bSheet(b.id,1)},
ax:id=>{B(id).ex.push({n:'Nowe ćwiczenie',s:3,r:'8-12',p:90,g:0});save();bSheet(id,1)},rm:(id,i)=>{B(id).ex.splice(+i,1);save();bSheet(id,1)},
dl:(id,t)=>arm(t,()=>{S.blocks=S.blocks.filter(b=>b.id!==id);save();closeSheet();render();toast('Blok usunięty')}),
split:id=>{const b=B(id);b.ex.forEach(e=>{if(e.g){e.g=0;e.p=Math.max(e.p,90)}});save();bSheet(id,0);toast('Teraz około '+dur(b)+' min')},
adj:(id,m)=>{const b=B(id),d0=dur(b);m=+m;if(m<0){for(let k=0;k<3&&d0-dur(b)<-m;k++)for(let i=b.ex.length-1;i>=0&&d0-dur(b)<-m;i--)if(b.ex[i].s>2)b.ex[i].s--}else b.ex.filter(e=>e.p>=120).slice(0,3).forEach(e=>{if(e.s<6)e.s++});save();bSheet(id,0);toast('Teraz około '+dur(b)+' min')},
sx:(id,i)=>{const e=B(id).ex[+i];if(e.o){e.n=e.o;delete e.o}else{e.o=e.n;e.n=ALT[e.n]||e.n+' (lżej, wolne tempo)'}save();bSheet(id,0)},
tm:s=>timer(+s),tx:()=>{clearInterval(ti);$('#tp').className=''},wsh:wSheet,ser:k=>{ser=k;render()},
ws:()=>{const g=i=>parseFloat($('#f-'+i).value.replace(',','.')),w=g('w');if(!(w>20&&w<300)){toast('Podaj wagę w kg');return}const bf=g('b'),mu=g('m'),d=$('#f-d').value||ymd(new Date());S.w=S.w.filter(x=>x.d!==d);S.w.push({d,w,bf:isNaN(bf)?null:bf,mu:isNaN(mu)?null:mu});save();closeSheet();render();toast('Zapisano pomiar')},
wdel:d=>{S.w=S.w.filter(e=>e.d!==d);save();render();toast('Pomiar usunięty')},
kc:d=>{S.set.kcal=Math.max(2000,Math.min(5000,S.set.kcal+(+d)));$('#kv').textContent=S.set.kcal;save()},
rs:(t)=>arm(t,()=>{S.blocks=seed().blocks;save();toast('Szablon przywrócony')}),cm:t=>arm(t,()=>{S.w=[];save();toast('Pomiary wyczyszczone')})};
document.addEventListener('click',e=>{if(lf){lf=0;return}const t=e.target.closest('[data-a]');if(!t)return;const[a,...p]=t.dataset.a.split(':');if(H[a])H[a](...p,t)});
document.addEventListener('pointerdown',e=>{lf=0;const t=e.target.closest('[data-lp]');if(!t)return;sx0=e.clientX;sy0=e.clientY;t.classList.add('hold');lt=setTimeout(()=>{lf=1;t.classList.remove('hold');const[a,...p]=t.dataset.lp.split(':');H[a](...p,t)},480)});

render(1);
(async()=>{try{if(!window.claude)return;const u=await claude.use('user'),db=await claude.use('db');if(!u||!db)return;const id=await u.id();if(!id)return;cloud=db.collection('data/users/'+id).doc('state');const sn=await cloud.get();if(sn.exists){const j=JSON.parse(sn.data().json);if(j&&j.blocks&&(j._t||0)>(S._t||0)){S=j;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}else cloud.set({json:JSON.stringify(S)});sync='k';render()}catch(e){}})();
